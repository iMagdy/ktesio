    status: open  # RATIFIED by Islam 2026-07-21 as a STANDING MANDATE (not a one-off task, so it stays open as an always-apply rule): every story that freezes a contract (wire shape, schema_version, exit code, or the Adapter Contract) gets an INDEPENDENT adversarial mutation pass by someone who did NOT write the gate; every closed hole re-verified by re-applying its original mutation; freeze fixtures must populate EVERY optional field. BINDS Story 6-6 (Adapter Contract v1 freeze) directly — enforce there.
    severity: medium
    action: "Make an INDEPENDENT ADVERSARIAL MUTATION PASS mandatory for any story that ships a frozen contract, and add a maximal-fixture rule. Story 4-3's primary review READ the compatibility gate and was correct about everything it positively asserted (all 22 diagnostics map correctly, main()'s downcast wiring is sound, usage reuses list/show's exact computation so numbers cannot drift, NDJSON compact at all 3 sites) -- it found no CRITICAL/HIGH. The adversarial pass MUTATED the gate and found 4 of 5 mutations undetected, most consequentially that the PRICED (Rate'd) wire shape had NO key-set freeze at all: every fixture was no-Rate, so skip_serializing_if omitted all dollar fields, leaving the metered/cost-controlled half of the contract -- i.e. the entirety of Epic 3's revenue-relevant surfaces -- completely unguarded (adding a field populated only in with_dollars() passed all 69 tests). Critically, the dev agent had ALREADY self-mutated three axes and found nothing: self-mutation confirms the tests you thought to write; adversarial mutation finds the ones you didn't. Reading a gate tells you what it checks; only mutation tells you what it MISSES, and a compatibility gate's entire value is the set of things it catches. Rule: (a) any story freezing a wire shape, schema_version, exit code, or the Adapter Contract gets a mutation pass by someone who did NOT write the gate; (b) every closed hole is re-verified by RE-APPLYING its original mutation (a hole-closing test that doesn't catch the thing that slipped through is theater); (c) freeze fixtures must populate EVERY optional field, since an unpopulated Option is invisible to the freeze. Cost is well-characterized -- 4-3's fix pass was one focused session, +11 tests. Binds Story 6-6 (freeze the Adapter Contract v1) directly. Owner: Islam / whoever owns the review-mandate defaults."
  - id: AI-65
    epic: 4
    owner: "Islam / whoever owns the review-mandate defaults"
    status: open
    severity: medium
    action: "Scope fix-pass review by whether the fix changes a VALUE or a MECHANISM. Story 4-2's crash-safety fix (21af762) was correct, thoroughly tested, and closed a real CRITICAL -- and CREATED a worse one: removing the stdout/stderr pipe (correctly, to stop an engine crash from SIGPIPE-killing the supervised agent) also removed the pipe's INCIDENTAL write backpressure, a property nothing had ever designed, documented, tested, or mentioned in any story. The result (4484019) was strictly worse than the bug being fixed -- 4-1's residual stall is bounded at ~5s, an OS-uninterruptible-I/O wait under the same global lock is unbounded. It was caught ONLY because the reviewer treated the fix as a NEW DESIGN deserving a fresh adversarial pass rather than as a patch needing confirmation that it works. Rule: a fix that changes a VALUE (timeout, threshold, deadline -- cf. 6463ec8, cba24be, b42cd23, all three fine) may be verified against its own tests; a fix that changes a MECHANISM (pipes -> direct files, channel -> mutex, blocking wait -> polling loop) is a new design and gets its own independent adversarial pass with an EXPLICIT charter: 'what invariant was the removed mechanism providing incidentally, that nothing names?' That is a different question from 'does the fix work,' and only the first one would have found this. Epic 4 contains both the failure case and the success case for this rule, which is why it is worth writing down now. Owner: Islam / whoever owns the review-mandate defaults."
  - id: AI-66
