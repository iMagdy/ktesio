    owner: "Dev / QA; scope as a dedicated hardening story"
    status: open
    severity: medium
    action: "Sweep the existing test suite for the FIVE named blind-spot patterns, starting with the one instance still open in main. Story 4-3's adversarial pass surfaced four and 4-2 shipped a fifth of the same family; together they are ONE class, not five incidents -- the suite testing what the CODE DOES rather than what the CONTRACT PROMISES. The patterns, each with a worked fix from this epic: (1) FIXTURE MONOCULTURE -- only the default/unpriced path exercised, so optional fields never materialize on the wire and freezing the wire freezes nothing about them (fix: maximal fixtures populating every optional field at once); (2) SILENT OS SELF-SKIP -- a runtime 'if OsId::current() == Windows { return; }' reports as PASSED, so CI showed green on Windows for assertions that never ran, and two such tests were the SOLE guards for real contract surfaces (fix: the _unix suffix convention, making the limitation visible in the test list, plus the written rule that a _unix test may be an ADDITIONAL proof, never the sole guard); (3) UNPINNED LINK -- both ends of a chain unit-tested, the link between them unasserted, so severing the mapper is invisible (fix: pin every mapper arm directly, driving the real mapper then the real classifier); (4) UNTESTED MODE COMBINATION -- flags covered individually but not their product (--follow --json was never exercised; making follow batches emit human text into an NDJSON stream passed all 33 logs tests); (5) TAUTOLOGICAL ASSERTION -- a field compared to the constant it was stamped from, so bumping the constant could not fail it (fix: pin the literal). START WITH THE KNOWN OPEN INSTANCE: story 4-2 documented, accepted, and shipped an instance of pattern (3) -- BackendError::StopUnconfirmed's wiring into stop_unconfirmed = true inside stop_inner is unreachable by any test, both halves independently well-tested, only the 3-line glue unexercised. That is structurally identical to 4-3's H1 and it is the glue for a CRITICAL fix; nobody connected the two at the time because 4-2's instance was recorded before 4-3's adversarial pass gave the pattern a name. Then sweep Epics 1-3's suites, prioritizing fixture monoculture given that Epic 3's priced surfaces are the ones that were found unguarded. Owner: Dev / QA; scope as a dedicated hardening story."
  - id: AI-67
    epic: 4
    owner: "Islam (cost/tier decision)"
    status: done  # RESOLVED 2026-07-27 (PR #120: 3629c5d, 39f08d5, b9b30cb, 51d86b7, 947cd68). Coverage job GREEN for the first time: 95.3169% (4376/4591), all 11 gates passing. TRUE ROOT CAUSE (found only on the 5th attempt, by controlled single-variable experiment): a STALE cached fake_agent. The coverage job restores target/ from a cache keyed on hashFiles(Cargo.lock); Cargo.lock had not changed since Epic 9, so the entry was frozen at 2026-07-14 -- predating the --echo-stdin and --heartbeat-stderr-ms flags. fake_agent silently ignores unknown args (_ => {}), so the child never echoed stdin and never wrote stderr; tests waited forever for output that could not arrive. Proof: swapping in the pre-6afac99 helper reproduced the exact CI assertion (out=336 err=0) with NO instrumentation on either axis; with a fresh helper the "tarpaulin-incompatible" tests pass under real LLVM instrumentation in 8.15s (vs the ~487s previously blamed on instrumentation). FIX: rm + rebuild fake_agent in the coverage step -- the identical guard the `test` job has had since the earlier macOS/Windows incident of this SAME bug class. FOUR PRIOR DIAGNOSES WERE ALL WRONG and their remedies were reverted (whole-job retry wrapper=AI-60; cfg!(tarpaulin) 120s deadline inflations; the 4 #[cfg_attr(tarpaulin, ignore)] skips; the "engine lock starvation" theory that motivated stacking AI-63). Net -177 lines of misdirected mitigation removed; 0 tests skipped. GUARDS so it cannot silently recur: test_automation.py now asserts the rebuild INSIDE the coverage step specifically (the pre-existing assertion was satisfied by the `test` job copy alone -- which is exactly why it never caught this), and fake_agent_bin() docs gained an "EXISTENCE IS NOT FRESHNESS" section. Once honest, the gate immediately earned its keep: it exposed crates/kt/src/cli/self_update.rs (user-facing update machinery) at 0/55 coverage, now tested incl. "a failed checksum never reaches the installer" and "a truncated download never yields a partial binary" (947cd68, +19 tests). STILL UNCOVERED, deliberately: ui.rs, install_channel.rs, update_check.rs -- worth a later pass. DEFERRED with evidence: self-verifying fake_agent_bin() freshness (removing the helper reproduced 2 build-lock flakes under nextest, since each test is its own process) -- separate follow-up.  # DIAGNOSIS DONE 2026-07-21 → ai-67-coverage-clustering-2026-07-21.md (findings spot-verified by the orchestrator against the CI logs). ROOT CAUSE (high confidence, call it H-D): cargo tarpaulin's LLVM instrumentation makes real-child-process IO round-trips ~100x slower (interaction-test binary = 87.6s instrumented vs whole suite <1min plain), so a shifting subset of a FIXED ~6-test real-IO pool misses its HARD-CODED wall-clock deadline nearly every attempt. REFUTED: H-A degraded-runner (three fresh-runner jobs on two branches fail the identical pool; resources flat/healthy — Mem 15Gi/14Gi-avail, Swap 0B, zero OOM) and H-B un-reset-retry-state (readings flat across attempts 1→2→3; attempt 3 sometimes did BETTER). The retry wrapper (AI-60) therefore cannot converge and should be REMOVED. FIX (small, test-only, permanent): scale the three offending deadlines under instrumentation — interaction.rs:117 (20s, already bumped once but still short), backends/unix/mod.rs:1550 (5s) and :1799 (10s, both never bumped) — gated on cfg!(tarpaulin) (the build already passes --cfg=tarpaulin, verified) or an env deadline, keeping today's values for plain nextest; tarpaulin --timeout 180 still guards genuine hangs. Also flagged: the heavy OOM apparatus (#101 split, 8GB swap, disk reclaim) was for the SOLVED AI-23 7GB-runner era; the runner now has 15Gi, so the workflow's "7GB/2-core" comments are stale. REMEDY RATIFIED by Islam 2026-07-21: the deadline-scaling CODE FIX (not paid runner, not demotion). Plan: gate the 3 offending deadlines (interaction.rs:117, backends/unix/mod.rs:1550 + :1799) higher under cfg!(tarpaulin) keeping plain-nextest values, and