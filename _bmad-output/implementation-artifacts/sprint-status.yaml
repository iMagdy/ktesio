  - id: AI-63
    epic: 4
    owner: "Islam / Winston (architect); execution naturally Epic 7 or a dedicated resilience story"
    status: in-progress  # Part (a) SWEEP DONE 2026-07-21 → ai-63-lock-sweep-2026-07-21.md (findings independently spot-verified by the orchestrator against source). Results: the retro's "single Mutex<Supervisor>" was imprecise — EngineInner holds TWO coarse mutexes (Registry + Supervisor) together for the whole op. The count is ~17 genuinely-unbounded FS operation sites under the lock (NOT 2) + fork/exec + a LATENT-unbounded bare child.wait() in the handle Drop (unix:580 — the 4-2 bug's exact shape, never bounded by the 4-2 fix) + the rusqlite class (fsync-at-commit only; SQLite contention is NOT an unbounded block — no busy_timeout, returns SQLITE_BUSY immediately). SEVEREST LIVE finding: drain_usage_for (supervisor.rs:2177) does std::fs::read of the ENTIRE, UNROTATED, monotonically-growing agent.log every 250ms per running instance on the crash-reaper hot path under both locks — degrades the whole fleet silently as uptime grows (exactly the long-running away-mode scenario), inverting the intuition that one-shot operator commands are the risk. Amplifier: poll_once→enforce_stop lets a single stop-action budget breach freeze the fleet lock ~35s automatically. Part (b) — the architectural fix decision (per-call bounds / per-instance write locks / actor-per-process) — is now with Islam+Winston; the severe drain_usage_for+rotation instance may warrant a tactical fix ahead of the broader redesign (Islam deciding). UPDATE 2026-08-23: TACTICAL FIX LANDED — PR #126 squash-merged to main 2026-08-12 as bbed9a7: incremental usage-drain read (new read_usage_tail helper reads only [cursor, len), plan_drain's decision logic byte-identical per adversarial billing-integrity review, UTF-8-at-cursor boundary safe) + post-stop RESCUE Terminal drain after backend.stop confirms death and before handle removal (closes the stat→read window under-count race the adversarial pass found; disjoint by cursor so no double-count; skipped on StopUnconfirmed; net improvement over Epic 3's ship). 924 tests. The broader ~17-site locking-model decision remains OPEN as part (b) with Islam+Winston — status stays in-progress. || 2026-08-26 AD-17 GATE CORRECTION (PR #145). Two records had drifted apart and this entry is routinely quoted for the wrong gate. (i) THIS item recommends doing part (a), THE SWEEP, before Epic 5 — and (a) is DONE. (ii) ARCHITECTURE-SPINE.md AD-17 ("Coarse global locking is a recorded decision, with a bounded-work rule") was written later, is the authoritative record, and scopes (b) explicitly: the replacement model "MUST be decided BEFORE Epic 7's daemon/embedding work begins", because a long-lived daemon removes the short-lived CLI-invocation lifetime that currently masks the cost. AD-17 is referenced nowhere else in this entry, which is why an Epic-5 framing persisted. What actually governed Epic 5 was AD-17's BOUNDED-WORK RULE, and story 5-1 complied with it by construction (bounded single-directory create_dir_all only; contents-copy and detach-time remove_dir_all refused by design; the residual `remove --delete` remove_dir_all at sweep site 17 recorded as an AI-63(b) input it could not fix). SUPERSEDED SCHEDULING NOTE: on 2026-08-13 Islam elected to decide (b) before story 5-1 started; 5-1 has since SHIPPED (PR #138, ff1f669) and 5-2 with it, so that sequencing choice is MOOT — it was always a scheduling preference, never a dependency. THE REAL GATE IS NOW IMMINENT: Epic 6 is in progress (6-1 done, 6-2 in progress) and Epic 7 is next, so per AD-17 part (b) must be decided before Epic 7 opens. Owner remains Islam + Winston (architect).
    severity: high
    action: "Close the 'unbounded operation under the single global Mutex<Supervisor>' bug class ARCHITECTURALLY, not per-call. Two independent CRITICALs in one epic (4-1's unbounded stdin write; 4-2's unbounded post-SIGKILL wait) share one root: an operation with no upper bound on its duration performed while holding the ONE lock every instance's every operation needs. Different stories, different authors, different triggers (a stuck agent's stdin vs. a process that will not die), same bug. Both were fixed by bounding that SPECIFIC call, which is correct and minimal but does not address the class and composes badly -- each bound adds another whole-engine stall window (AI-59 measured an UNRELATED instance's send at 4.31s, resolving in lockstep with the stuck instance's 5.01s timeout; two 5s bounds exist today, STDIN_WRITE_TIMEOUT and KILL_CONFIRM_TIMEOUT), and nobody has enumerated what ELSE runs unbounded under that lock -- we found both instances only because someone was reading that story's diff. (a) SWEEP: enumerate every operation performed while EngineInner's supervisor lock is held and classify each bounded/unbounded -- mechanical, one sitting, and it sizes the problem (we currently do not know if there are 2 or 12). (b) DECIDE, with (a) in hand: keep bounding per-call, per-instance write locks, or an actor/dedicated-writer task per supervised process with the global lock guarding only bookkeeping. Epic 7's daemon makes this materially worse -- every embedded consumer stalls, not just one short-lived CLI invocation whose forgiving lifetime currently masks it -- so Epic 7 should inherit a DECISION, not rediscover the problem. Recommend doing (a) BEFORE Epic 5 opens, since Epic 5 adds filesystem operations to the engine and filesystem operations are exactly the shape that ends up unbounded under a lock. SUBSUMES AI-59 (closing this should close that). May warrant an explicit AD in ARCHITECTURE-SPINE.md -- the current single-lock model appears to be an implementation fact rather than a recorded decision, which is part of why two stories walked into it independently. Owner: Islam / Winston (architect); execution naturally Epic 7 or a dedicated resilience story."
