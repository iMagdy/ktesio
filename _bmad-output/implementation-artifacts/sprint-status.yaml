    severity: low
    action: "Decide exit code 6's permanent gate: build a deterministic stuck-agent harness, or ratify the mapper pin as sufficient. Exit code 6 (InteractionTimedOut) has NO end-to-end assertion on ANY OS. A genuine timeout needs a stuck agent whose 64KB stdin pipe buffer is full -- exactly the slow, sleep-shaped, flaky setup this suite forbids on determinism grounds -- so story 4-3 instead pinned the MISSING LINK deterministically (every_engine_error_mapper_arm_preserves_its_documented_exit_code drives the REAL map_engine_error then the REAL classify for every non-1 engine-error class) and composed it with the 0-4 end-to-end proofs of main()'s wiring; AC2's wording was honestly rewritten to say so rather than keep the blanket claim the adversarial pass had just falsified. That is a sound argument. The open question is whether a deterministic harness is achievable at acceptable cost -- e.g. a fake_agent flag that provably never drains stdin plus a deliberately-filled pipe, no sleeps -- or whether the mapper pin is RATIFIED as the permanent gate for this one code. Related residual worth deciding alongside it: the D-state / OS-uninterruptible-I/O scenario behind 4-2's StopUnconfirmed fix has NEVER been reproduced against the fixed code. A ramdisk provably cannot reproduce it (zero write latency by construction -- it returns ENOSPC instantly rather than throttling), and real-disk reproduction was ruled out after two disk-fill incidents costing ~86GB and ~55GB. The fix is sound BY CONSTRUCTION (independently traced to Child::try_wait(), confirmed non-blocking regardless of WHY a process will not die), which is a stronger argument than a single passing observation -- but it is an argument, not an observation. Also note the 7 _unix-suffixed tests that skip Windows: none is the sole guard for anything OS-independent, but the gap is real and now visible. Owner: Dev / QA; Islam to ratify if the answer is 'the mapper pin is permanent'."
  - id: AI-70
    epic: 4
    owner:
    status: done  # FIXED 2026-08-12 in the same change that added this entry. Helper `wait_for_agent_log_line` (logs.rs, mirroring the existing `wait_for_usage_rows` / `wait_for_agent_pid` poll-with-deadline idiom) now waits for `heartbeat 0` instead of reading agent.log straight through; the beat is the LAST of the three line kinds the test asserts, so waiting on it settles the whole file. Verified 30/30 consecutive local runs plus the full 10-test logs.rs suite. Swept the sibling call sites while here: logs.rs:552 and :967 assert heartbeats through the RETAINED-LOG api (already synchronised) and pause.rs:85 only COUNTS beats across a pause boundary (no presence assertion), so line 667 was the only unsynchronised one.
    severity: medium
    action: "logs.rs `legacy_agent_log_is_byte_identical_to_pre_story_content` was flaky: it asserted a verbatim `heartbeat 0` line in agent.log immediately after `wait_for_usage_rows` returned. Root cause is an ORDERING assumption, not runner load -- `fake_agent` writes the ready line, then every usage line, and only THEN arms its heartbeat clock, so the first beat lands one full --heartbeat-ms interval (40ms in this test) AFTER the last usage line, while the engine's drain pass can commit all three ledger rows inside that window. Caught on PR #48, whose diff is workflow YAML ONLY and therefore could not have caused it; it went RED on macos-latest then GREEN on re-run of the identical commit, which is what ruled out a real regression. GENERALISABLE LESSON, and the reason this is its own item rather than a line under AI-49: synchronising on the LEDGER does not synchronise agent.log -- they are independent streams, and every test that waits on one before asserting the other has this latent shape. DISTINCT FROM AI-49, which is about heavy integration tests contending under a full parallel workspace run (crash.rs restart-count, a cost.rs metering test); this one fails from a missing happens-before edge and would flake at any parallelism level, including a single-threaded run. AI-49 remains open on its own merits."
