    status: open
    severity: medium
    action: "4-1's send_input fix (commit 4b4ac96) bounds a stuck agent's blocking stdin write to a 5s timeout instead of leaving it unbounded (the CRITICAL bug an adversarial audit found and this fix closes, independently re-verified empirically: bounded not permanent, recoverable via stop+start, no compounding on retry). But the bound is achieved by holding the engine's single global Mutex<Supervisor> through the whole 5s recv_timeout wait, so a stuck write still stalls EVERY instance's operations (incl. the crash reaper) for up to ~5s, not just the stuck instance -- independently measured (an unrelated instance's send took 4.31s, resolving in lockstep with the stuck instance's ~5.01s timeout, not near-instantly). This was a deliberate, disclosed, EXPLICITLY-SPECIFIED tradeoff in the fix design (mirrors stop()'s existing accepted bounded-lock-hold pattern) chosen over building a full per-instance-lock/decoupled-write architecture under fix-pass time pressure -- not a surprise shortfall, and a major severity downgrade from the original (unbounded+permanent+unrecoverable) bug. Full fix: decouple a single instance's stdin write from the fleet-wide lock (e.g. a per-instance write lock/channel, or an actor-style dedicated writer task per supervised process) so an unrelated instance's ops are genuinely unaffected, not just bounded-in-lockstep. Natural to revisit alongside Epic 7's daemon/persistent-engine-session work, where write isolation matters even more. Owner: whoever picks up Epic 7, or a dedicated resilience story if it proves insufficient in practice before then."
