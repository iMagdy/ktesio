    severity: medium
    action: "Decide the coverage gate's fate: FIX IT OR DEMOTE IT HONESTLY. Coverage has now been red-at-merge for FOUR of five epics (1, 2, 3, and Epic 4 TWICE -- PR #117 and #119), Epic 9 being the sole exception. Each cause genuinely differed and each was fully diagnosed before Islam authorized the merge, with every OTHER gate confirmed genuinely green first -- this is not carelessness -- but a REQUIRED gate that is reliably overridden has stopped carrying information while still costing CI minutes and attention, and it trains everyone to read 'coverage red' as 'coverage red again.' AI-60's own closure text explicitly asks for a RUNNER-TIER ESCALATION TO ISLAM rather than another attempt-count bump, and that escalation has not happened. Options: (a) a larger-RAM/paid runner (a cost decision only Islam can make -- AI-36's original option resurfacing in a new guise); (b) further diagnosis of why the SAME small test cluster fails TOGETHER within a single attempt, which is not what independent per-attempt bad luck looks like -- a persistently-degraded runner instance for its whole lifetime, and state not being reset between same-job retry attempts, both remain open and undiagnosed; (c) demote coverage to a non-blocking informational job and stop calling it a gate. Also carry forward AI-62's generalization as a standing rule: ANY AGGREGATION STEP THAT CAN SILENTLY DROP AN INPUT MUST FAIL LOUDLY INSTEAD -- the merge script reported a confident, precise, entirely FALSE 'merged coverage 68.2% is below 95%' when the real story was that the largest crate was missing from the measurement, and it was caught only because Islam found the EXPLANATION suspicious, not the number. A gate that fails loudly costs a rerun; a gate that reports a plausible wrong number costs a debugging session down the wrong path. Owner: Islam (cost/tier decision)."
