  - id: AI-60
    epic: 4
    owner:
    status: done  # DONE 2026-07-19 (4c3a231 + c861c34 + 5cce78f): whole-job retry wrapper added (2→3 attempts); PR #117/#119 merged over red coverage by Islam's explicit call. *** CAUSAL EXPLANATION RETRACTED 2026-07-21 (see AI-67): this item's "runner contention / bursty flakiness" diagnosis was WRONG. Real cause is DETERMINISTIC tarpaulin LLVM-instrumentation latency (~100x slower real-child-IO round-trips: the interaction binary takes 87.6s instrumented vs the whole suite <1min plain), so ~6 real-IO tests miss HARD-CODED wall-clock deadlines nearly every attempt. Verified: resources flat/healthy every attempt (Mem 15Gi/14Gi-avail, Swap 0B, zero OOM), three fresh-runner jobs on two branches fail the IDENTICAL 6-test pool -> reproduces on every fresh runner, so the retry wrapper CANNOT converge (never was contention). The retry is to be REMOVED and replaced by AI-67's deadline-scaling fix. Wrapper-added + merged-over-red stand as historical fact; the "why" is corrected. ***
    severity: medium
    action: "The ubuntu coverage job (tarpaulin, free-tier runner) exhibited a THIRD distinct resource-fragility symptom this epic (after #101's OOM and #109's ubuntu-adoption-hang): real-time waits on a child-process round trip (spawn + stdin write + stdout capture) transiently stalled COMPLETELY (not just slow) -- across every rerun of the identical PR #117 commit tried so far (5+), a DIFFERENT, unrelated test failed each time, always one needing real child I/O (both integration tests in tests/*.rs and plain unit tests under backends::unix::tests), never a fast-fail path; a local repro under the identical tarpaulin/instrumentation config passed instantly every time it was tried. Diagnosed as runner contention, not a product bug (Islam concurred, chose the retry-wrapper option over 3 alternatives). A same-JOB retry runs on the SAME runner instance (unlike a `gh run rerun`, which gets a fresh one) -- so it only helps if the contention is bursty/intermittent within one runner's lifetime, not constant for its whole life; the observed pattern (different tests failing each attempt, most but not all real-IO tests passing even in a failing attempt) is consistent with bursty, supporting more attempts as a reasonable mitigation. Mitigated, not root-caused, with a whole-JOB retry (never a per-test retry -- this repo already has a concrete lesson, the 4-2 H1 fix, of a per-test retry silently absorbing a real, reproducible data-loss race): the coverage step's per-crate loop + lcov merge + >=95% gate now runs in a subshell function, retried up to 2 times (3 total attempts). A genuine coverage regression or a genuine test bug still reproduces on EVERY attempt and fails the job. If 3 attempts still doesn't get green, or this keeps recurring often enough to erode confidence in the gate or burn excessive CI minutes, escalate to Islam for a runner-tier decision (mirrors AI-36's original larger-runner option) rather than continuing to bump the attempt count."
