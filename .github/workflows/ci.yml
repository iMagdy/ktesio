name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    # AI-37/AI-54 (story 11-5): the FULL CI — the 3-OS test matrix and the
    # coverage job included — runs on EVERY branch push, not only main and not
    # only PRs. The old main-only push filter meant a feature branch's
    # commits got local-OS-only verification until the PR was opened (Epic 2's
    # lesson: cross-OS + coverage surprises surfaced under merge pressure);
    # this glob keeps the existing push-to-main runs AND runs the same job set
    # on every feature-branch push (the Epic-9 precedent, now codified).
    # Repeated pushes to the same branch collapse into one run via the
    # concurrency group below (cancel-in-progress).
    branches:
      - "**"
  schedule:
    # Nightly full CI on the default branch (GitHub runs `schedule` there):
    # an always-fresh cross-OS + coverage record even when nothing pushed.
    # 07:17 UTC — off the top of the hour where scheduled jobs queue longest.
    - cron: "17 7 * * *"
  # Manual dispatch (the AI-37 "or nightly/manual on feat/* branches" shape):
  # run the full job set on any ref on demand from the Actions tab / `gh
  # workflow run`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        # Explicit +stable: the root rust-toolchain.toml pins bare `cargo` to the
        # MSRV (1.96.1); this job intentionally exercises latest stable, and a
        # +toolchain argument overrides the toolchain file. The dedicated `msrv`
        # job proves the 1.96.1 floor.
        run: cargo +stable fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Run clippy
        # Explicit +stable (see fmt job): pin covers local bare cargo; CI stays
        # on latest stable here, MSRV floor proven by the `msrv` job.
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    # 3-OS matrix (spine AD-4, NFR-2): the per-OS ProcessBackend supervision code
    # (Unix process groups / Windows Job Objects) is UNVERIFIABLE on a single OS —
    # cfg(windows) code does not even compile on Linux, so the Windows Job-Object
    # backend's behavior is proven ONLY by the windows-latest runner here. Linux +
    # macOS prove the Unix backend on both Unixes. Coverage (tarpaulin, Linux-only)
    # measures the OS-agnostic core + the Unix backend; the Windows backend's
    # correctness rides on this matrix, its lines cfg-excluded from the Linux
    # coverage denominator (see docs/testing.md — coverage-honesty reconciliation).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ubuntu is a genuine 2-core runner and Windows' bundled-SQLite/tokio first
    # build is slow; this job builds test binaries, runs the suite, and runs the
    # doctest pass. 25 gives headroom now that the heavy ktesio-engine integration
    # tests are SERIALIZED (the `engine-integration-serial` max-threads=1 test-group
    # in .config/nextest.toml) — the source fix for the x86-ubuntu `adoption` hang
    # (#106), where concurrent heavy process-spawning wedged the 2-core runner into
    # an uninterruptible D-state. nextest's per-test kill-timeout (see
    # .config/nextest.toml) remains the cross-OS per-test hang guard.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # runner.os keys the cache per-OS so the three matrix legs never collide.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Cache cargo-nextest binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Persist the source-installed cargo-nextest so it is not rebuilt on
          # every fresh runner — mirrors the semver / tarpaulin binary caches
          # (AI-1/AI-23). runner.os keys it per-OS. restore-keys lets a partial
          # match seed ~/.cargo/bin so the install guard below finds it warm.
          key: ${{ runner.os }}-cargo-nextest-bin
          path: |
            ~/.cargo/bin
          restore-keys: ${{ runner.os }}-cargo-nextest-bin
      - name: Install cargo-nextest
        # Repo-consistent install idiom (same as the semver / tarpaulin gates):
        # `cargo install --locked`, guarded by `command -v` so a cache hit skips
        # the rebuild. Deliberately NOT a third-party install action — this repo
        # SHA-pins its actions and installs its cargo tooling from source, so a
        # tag-pinned install-action would be an inconsistent supply-chain surface.
        # Explicit +stable (see fmt job): install under the same toolchain the
        # matrix legs test with.
        shell: bash
        run: command -v cargo-nextest >/dev/null 2>&1 || cargo +stable install cargo-nextest --locked
      - name: Build test binaries (nextest --no-run)
        # SPLIT build from run (#106): the fused compile+run step could not
        # attribute a stall to build-vs-run, and a job-timeout cancel discards the
        # whole job-log blob (BlobNotFound) — so when the 40-min ubuntu leg was
        # cancelled we were blind to WHERE it stalled. GitHub preserves per-STEP
        # status even when the job-log blob is lost, so building the test binaries
        # in their OWN step reveals whether a future stall is in compile or in run.
        #
        # nextest replaces `cargo test` for the suite (#106): a slow or hung engine
        # integration test becomes a NAMED, time-boxed failure with captured logs
        # (see .config/nextest.toml — slow-timeout terminates a stuck test at
        # ~4 min) instead of silently burning the job budget. Explicit +stable (see
        # fmt job): the 3-OS matrix exercises latest stable per OS; the root pin
        # governs only local bare cargo. MSRV floor: the `msrv` job.
        #
        # `rm -f target/debug/fake_agent*` FORCES a fresh rebuild of the `fake_agent`
        # test helper (kept from the earlier fix). The per-OS `target/` cache can
        # restore a STALE fake_agent whose newer `--emit-usage`/`--dump` args are
        # silently ignored (older `--linger-ms`/`--heartbeat-ms` still work) —
        # failing ONLY the metering integration tests on macOS/Windows while Ubuntu
        # + local pass. The engine passes the launch args correctly; this is a
        # test-harness cache artifact, not a product bug. `shell: bash` so `rm` works
        # on the Windows runner too.
        #
        # Then EXPLICITLY rebuild the bin: unlike `cargo test --all-targets` (which
        # hardlinks the bin to target/debug/fake_agent), `cargo nextest run
        # --all-targets` only compiles it for its own unit tests and does NOT place
        # that top-level hardlink. The process-spawning tests resolve the helper at
        # target/debug/fake_agent (`ktesio_conformance::fake_agent_bin`), so without
        # this build the first such tests race on the lib's on-demand `cargo build`
        # fallback (concurrent cargo invocations contend on the build-dir lock —
        # observed as a flake). The explicit build makes the path deterministic.
        # `--no-run` compiles every test binary without executing; the run steps
        # below reuse these artifacts (no double build).
        shell: bash
        run: |
          rm -f target/debug/fake_agent target/debug/fake_agent.exe
          rm -f target/debug/hermes_shim target/debug/hermes_shim.exe
          cargo +stable build -p ktesio-conformance --bin fake_agent
          # hermes_shim gets the SAME freshness guard (review-of-6-2, vg-o1):
          # the hermes e2e test resolves it at target/debug/hermes_shim via the
          # same exists()-only locator (install_shim, ktesio-engine/tests/
          # hermes.rs), so a cached stale copy would silently shadow the
          # committed launcher's current arg surface (--crash-* family).
          cargo +stable build -p ktesio-conformance --bin hermes_shim
          cargo +stable nextest run --workspace --all-targets --no-run
      - name: Run tests (nextest)
        # Single unified run for all three OSes (#106). The x86-ubuntu `adoption`
        # hang — concurrent heavy re-exec'd process-spawning wedging the genuine
        # 2-core runner into an uninterruptible D-state — is fixed AT THE SOURCE by
        # the `engine-integration-serial` test-group in .config/nextest.toml
        # (max-threads=1 over `kind(test) & package(ktesio-engine)`), which caps the
        # heavy engine integration binaries to one at a time WITHOUT skipping any
        # test (full Linux coverage retained). So no per-OS special-casing, watchdog,
        # or bisect is needed — a per-binary CI bisect had pinned the hang to the
        # `adoption` binary. `retries` + `slow-timeout` in that same config still
        # absorb the windows-latest timing flake and time-box a genuinely stuck test.
        # Explicit +stable (see fmt job): the 3-OS matrix exercises latest stable per
        # OS; the root pin governs only local bare cargo. MSRV floor: the `msrv` job.
        run: cargo +stable nextest run --workspace --all-targets
      - name: Run doctests
        # nextest does not run doctests, so run them separately to keep the doc
        # examples gated (`--doc` and `--all-targets` cannot combine in one cargo
        # invocation). Explicit +stable (see fmt job).
        run: cargo +stable test --workspace --doc

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build release binary
        # Explicit +stable (see fmt job): CI build sanity on latest stable; the
        # root pin governs only local bare cargo.
        run: cargo +stable build --release
      - name: Build the embedding quickstart example (story 7-4)
        # The publish capstone's compile-level proof: the quickstart is HOST
        # code — it links only ktesio-engine's public facade (no kt, no
        # ktesio-conformance) — so building it in CI proves the embedding
        # surface compiles from outside the engine crate, exactly what a
        # crates.io host will do once the HELD publish runs
        # (docs/release-process.md). Keeping the build in this job means a
        # facade regression reds the ordinary build gate before any host ever
        # sees it. Explicit +stable (see fmt job).
        run: cargo +stable build --release --example embedding-quickstart -p ktesio-engine
      - name: Run the embedding quickstart (hermetic)
        # Ubuntu-scoped BY JOB DESIGN: this whole `build` job runs on
        # ubuntu-latest only (the build matrix is the `test` job's), so the
        # run step needs no `runner.os == 'Linux'` guard — the binary path
        # (`target/release/examples/embedding-quickstart`, no .exe suffix)
        # can never meet a Windows/macOS runner here. The example itself is
        # still COMPILED on all three OS legs (see the embed-clean/build
        # surfaces that run in the 3-OS `test` matrix); only the hermetic
        # run is ubuntu-scoped.
        # The example is also RUNNABLE hermetically, so this gate is "works",
        # not just "compiles": its only subprocess is a re-exec of itself
        # idling under a hard 120 s cap (see the example's header), everything
        # runs on a per-process temp-dir root, and every leg (register →
        # configure → subscribe → start → observe → stop) ASSERTS instead of
        # printing — the configure read-back, the at-least-one-event drain,
        # the running state, and the Fleet budget row — so a failure exits
        # nonzero and reds this job. One short-lived process spawn, no
        # external service, no network, no fixture crates. The step-level
        # timeout is independent of (and far tighter than) the agent's own
        # 120 s idle cap, and the binary is asserted present first so a
        # build-step regression fails with a CLEAR message, not a confusing
        # "file not found".
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/examples/embedding-quickstart || {
            echo "::error::embedding-quickstart binary not found at target/release/examples/embedding-quickstart — the build step above failed or the output path moved."
            exit 1
          }
          target/release/examples/embedding-quickstart

  perf-budgets:
    name: perf-budgets
    # Story 7-5 (NFR-4): the DESIGNATED performance job. NFR-4's budgets
    # (reads < 1s on a 25-instance Fleet; supervision overhead <= 2% CPU and
    # <= 50MB RSS per running instance) are benchmarked here on every PR —
    # measured, not assumed — and a regression FAILS this job (blocking; the
    # run step is never allowed to fail). Gate policy (the harness prints it,
    # with all measured numbers, as a JSON report in this job's log — the
    # measured record of record, also uploaded as this job's artifact): reads
    # p99 and RSS/instance gate hard at budget; CPU/instance gates strict
    # (x1.0) locally and carries the harness's DOCUMENTED shared-runner
    # tolerance (x1.5, named in the report) over the MEDIAN OF THREE windows
    # here, because a hosted runner's co-tenant noise is uncontrollable.
    # Gated separately from the standard test matrix (a dedicated ubuntu job,
    # not a matrix leg) so the measurement is comparable run-to-run and
    # perf-noise flakiness can never spill into the ordinary test gates.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build the perf harness (release profile)
        # Release profile: the measurement must not pay dev-profile build
        # noise. Explicit +stable (see fmt job): the root rust-toolchain.toml
        # pins only local bare cargo; MSRV floor: the `msrv` job.
        run: cargo +stable build --release -p ktesio-engine --example perf-budgets
      - name: Rebuild the fake_agent helper (stale-helper guard)
        # The SAME stale-helper guard the test + coverage jobs carry (and
        # scripts/test_automation.py enforces for any job that spawns
        # agents): this job's target/ cache key is Cargo.lock-derived, so a
        # helper-only change cannot bust it and a frozen binary would
        # silently ignore newer flags (unknown args are `_ => {}`). The
        # harness resolves the helper at target/release/fake_agent; rm +
        # explicit rebuild makes that deterministic instead of racing the
        # lib's on-demand build fallback (the build-dir lock contention
        # flake). hermes_shim is NOT needed here — the harness spawns only
        # fake_agent.
        shell: bash
        run: |
          rm -f target/release/fake_agent target/release/fake_agent.exe
          cargo +stable build --release -p ktesio-conformance --bin fake_agent
      - name: Run the perf harness (NFR-4 budgets; regressions fail this job)
        # Blocking by design: a budget regression (reads p99 over 1s, RSS
        # over 50 MiB/instance or its 2x spike guard, CPU over its applicable
        # budget) exits nonzero and reds this job, per the AC "regressions
        # fail the perf job". The runner's ambient CI=true env switches the
        # harness into its documented CI mode (median-of-3 windows + the
        # tolerance, and the reads gate's one 30s-cool-down retry). The env
        # var also makes the harness write the JSON report to a file, which
        # the step below uploads as the job's artifact — the run line itself
        # stays the bare binary invocation so the step cannot silently
        # swallow a nonzero exit.
        timeout-minutes: 10
        env:
          PERF_BUDGETS_REPORT_PATH: perf-budgets-report.json
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/examples/perf-budgets || {
            echo "::error::perf-budgets binary not found at target/release/examples/perf-budgets — the build step above failed or the output path moved."
            exit 1
          }
          target/release/examples/perf-budgets
      - name: Upload the measured report (artifact)
        # The measured record of record also lives in this job's log; the
        # artifact makes it downloadable for trend inspection. `if: always()`
        # so a red (regression) run's numbers are preserved too — that is
        # exactly when the record matters most.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-budgets-report
          path: perf-budgets-report.json
          if-no-files-found: warn

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate docs
        run: python3 scripts/check_docs.py
      - name: Validate release doc generation
        run: python3 scripts/generate_release_docs.py v0.0.0 --output-dir target/release-docs-test
      - name: Test automation helpers
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_automation.py
      - name: Install docs site dependencies
        run: npm ci --prefix docs
      - name: Build docs site
        run: npm run --prefix docs build

  boundary:
    name: boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check kt against its declared crate graph
        # Explicit +stable (see fmt job): boundary gate runs on latest stable; the
        # root rust-toolchain.toml pins only local bare cargo. MSRV floor: `msrv` job.
        run: cargo +stable check -p ktesio
      - name: Enforce kt dependency law (AD-2)
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo +stable tree -p ktesio -e normal,build --all-features)"
          echo "$tree"
          # Allowlist, not blocklist: any internal ktesio-* edge other than
          # ktesio-engine / ktesio-adapter-api / ktesio-adapters-hermes fails,
          # so future internal crates are caught automatically.
          scan_status=0
          edges="$(printf '%s\n' "$tree" | grep -oE 'ktesio-[a-z0-9_-]+' | sort -u)" || scan_status=$?
          if [ "$scan_status" -ge 2 ]; then
            echo "::error::grep exited ${scan_status} while extracting internal crate edges."
            exit "$scan_status"
          fi
          violations=''
          if [ -n "$edges" ]; then
            filter_status=0
            violations="$(printf '%s\n' "$edges" | grep -Evx 'ktesio-(engine|adapter-api|adapters-hermes)')" || filter_status=$?
            if [ "$filter_status" -ge 2 ]; then
              echo "::error::grep exited ${filter_status} while applying the internal-crate allowlist."
              exit "$filter_status"
            fi
          fi
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::kt may depend only on ktesio-engine (plus ktesio-adapter-api types and the ktesio-adapters-hermes builtin); forbidden internal crate edge found."
            # WHY the adapters-hermes edge is allowed (review blind-22): it is
            # the builtin native-adapter table the engine's `native()` matcher
            # consults to resolve `--kind hermes` — code, not a plugin, so the
            # shipping binary carries it. Any OTHER internal crate must stay
            # out of kt's graph (mock/dev fixtures ride dev-dependencies only).
            exit 1
          fi
          echo "Boundary gate green: internal edges are exactly the allowlisted ktesio-engine / ktesio-adapter-api / ktesio-adapters-hermes."
      - name: Enforce OS-conditional code location (engine backends only)
        shell: bash
        run: |
          set -euo pipefail
          # Class pattern: catches #[cfg(unix)], #[cfg(not(windows))],
          # #[cfg(all(unix, ...))], #[cfg(any(...))], cfg!(...), and
          # #[cfg_attr(...)] forms naming an OS token.
          pattern='cfg[!(]?.*(unix|windows|target_os|target_family)'
          # Allowlist: engine backends (the convention home, spine AD-4) plus
          # two pre-existing v0.5.0 legacy CLI files (self-update platform
          # detection) grandfathered until epic 8 relocates/deprecates them
          # (AC-4 amendment, ratified 2026-07-02), plus engine integration
          # TESTS: the symlink-containment test (memory.rs:605, story 5-1) is
          # the one honestly unix-gated suite there under the AI-35 disclosure
          # convention ("the test does not exist on Windows" rather than
          # passing vacuously) — adoption/interaction suites deliberately use
          # NO cfg (data-driven OS ids); no production code may use cfg.
          allowlist='^crates/ktesio-engine/src/backends/|^crates/kt/src/update_check\.rs:|^crates/kt/src/cli/self_update\.rs:|^crates/ktesio-engine/tests/'
          scan_status=0
          hits="$(grep -rn --include='*.rs' -E "$pattern" crates/)" || scan_status=$?
          if [ "$scan_status" -ge 2 ]; then
            echo "::error::grep exited ${scan_status} while scanning for OS-conditional code."
            exit "$scan_status"
          fi
          violations=''
          if [ -n "$hits" ]; then
            filter_status=0
            violations="$(printf '%s\n' "$hits" | grep -Ev "$allowlist")" || filter_status=$?
            if [ "$filter_status" -ge 2 ]; then
              echo "::error::grep exited ${filter_status} while applying the OS-cfg allowlist."
              exit "$filter_status"
            fi
          fi
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::OS-conditional cfg is allowed only under crates/ktesio-engine/src/backends/ and crates/ktesio-engine/tests/ (legacy kt self-update files are grandfathered until epic 8)."
            exit 1
          fi
          echo "OS-cfg gate green: hits only in the backends home / grandfathered legacy files."
      - name: Enforce single currency-formatting module (story 3-3, AD-8)
        shell: bash
        run: |
          set -euo pipefail
          # AD-8: exactly ONE module formats currency. Money becomes a `$X.XX` human
          # string ONLY in crates/ktesio-engine/src/domain/cost.rs (render_dollars /
          # render_dollars_bare). Every other module passes Micros + EstimateLabel as
          # DATA; --json emits integer micros, never a `$` string. This gate FAILS if a
          # `$`-string-building form appears anywhere else.
          #
          # BROADENED alternation (a narrow `\$\{` missed several dollar-string shapes):
          #   \$ ?\{  — `${...}` AND `$ {...}` (a `$` glued to a format placeholder,
          #             with or without a space): format!("${x}") / "$ {}"
          #   \}\$    — `}$` (a placeholder immediately followed by a `$`): "{}$"
          #   "\$     — a string literal STARTING with `$`: "$", "$0.00", write!(f,"$")
          #   '\$'    — a bare `$` char literal: '$'
          pattern='\$ ?\{|\}\$|"\$|'\''\$'\'''
          # Allowlist (precise, not blanket-by-file): the ONE currency module (the
          # render home + its unit tests), PLUS the genuinely NON-currency `$` uses the
          # broadened pattern also matches —
          #   contains\(.\$  — `.contains('$')` / `.contains("$...` DISCIPLINE READ-checks
          #                    (they assert a `$` is absent/present on a surface; a read
          #                    never FORMATS currency, so it cannot hide a regression).
          #   \$PWD / \$KT_TEST — shell-variable interpolation in a spawned command
          #                    string (a process backend test), not a dollar figure.
          # No NEW currency formatting may appear anywhere else in the workspace.
          allowlist='^crates/ktesio-engine/src/domain/cost\.rs:|contains\(.\$|\$PWD|\$KT_TEST'
          scan_status=0
          hits="$(grep -rn --include='*.rs' -E "$pattern" crates/)" || scan_status=$?
          if [ "$scan_status" -ge 2 ]; then
            echo "::error::grep exited ${scan_status} while scanning for currency formatting."
            exit "$scan_status"
          fi
          violations=''
          if [ -n "$hits" ]; then
            filter_status=0
            violations="$(printf '%s\n' "$hits" | grep -Ev "$allowlist")" || filter_status=$?
            if [ "$filter_status" -ge 2 ]; then
              echo "::error::grep exited ${filter_status} while applying the currency allowlist."
              exit "$filter_status"
            fi
          fi
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Currency formatting (a \`\$\`-string form: \`\${...}\`, \`\$ {}\`, \`{}\$\`, a \"\$\"-prefixed string, or a '\$' char) is allowed ONLY in crates/ktesio-engine/src/domain/cost.rs (AD-8: one currency module). Pass Micros + EstimateLabel as data and render through render_dollars / render_dollars_bare."
            exit 1
          fi
          echo "Currency gate green: dollar formatting lives only in the one currency module."

  semver:
    name: semver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The armed in-repo baseline guard (#160, epic-6 retro A1; engine arm
          # in story 7-4) diffs TWO frozen surfaces against their freeze
          # commits: ktesio-adapter-api against the contract-v1 freeze commit
          # 4119db3, and ktesio-engine against the embedding-surface freeze
          # commit 8a8b328 (see the baseline comment below for why the two
          # SHAs differ). The default shallow clone cannot resolve a
          # historical rev, so this job fetches full history for the baseline
          # lookups.
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Resolve the cargo-semver-checks version (AI-3)
        id: semver_version
        run: |
          set -euo pipefail
          user_agent="ktesio-ci-semver-gate (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}; CI semver gate)"
          # The cache key must name a CONTENT hash, never a constant (AI-3): it
          # carries the resolved cargo-semver-checks version so a toolchain
          # update gets a fresh key. Non-fatal on crates.io trouble — an
          # "unknown" suffix degrades to an unpinned key, never a red gate.
          version="$(curl --silent --show-error --user-agent "$user_agent" --max-time 30 --retry 3 "https://crates.io/api/v1/crates/cargo-semver-checks" | sed -n 's/.*"max_version":"\([^"]*\)".*/\1/p' || true)"
          # Guard the resolved value (AI-3 hardening): an error body, JSON
          # drift, or any non-triple must never reach a `cargo install
          # --version <garbage>` under set -e — degrade to "unknown" (presence
          # check) instead of a red gate.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || version=unknown
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Restore cargo-semver-checks binary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Persist the source-installed cargo-semver-checks so the armed gate
          # does not rebuild it (~10 min) on every fresh runner (AI-1). AI-3:
          # the key carries the resolved version AND the save below fires only
          # when an install actually ran — with the old constant key, a dormant
          # run (gate unpublished pre-7-4, so no install ever executed) froze an
          # entry without the binary under the ONE key the armed gate needed,
          # forcing a rebuild on every armed run.
          key: ${{ runner.os }}-cargo-semver-checks-bin-${{ steps.semver_version.outputs.version }}
          restore-keys: ${{ runner.os }}-cargo-semver-checks-bin-
          path: |
            ~/.cargo/bin
      - name: Check public API semver (ktesio-engine, ktesio-adapter-api)
        id: semver_check
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.semver_version.outputs.version }}"
          user_agent="ktesio-ci-semver-gate (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}; CI semver gate)"
          # Install the binary UP FRONT: the armed in-repo baseline guards below
          # run on EVERY push, so the old "lazy install inside the armed
          # branch" dormancy no longer applies — the adapter-api and engine
          # surfaces are guarded in-repo even while the crates.io baselines
          # stay dormant until the held publish executes
          # (docs/release-process.md). Same +stable + --locked + version-pin +
          # unknown-degrade idiom as before (AI-3).
          if [ "$version" = "unknown" ]; then
            if ! command -v cargo-semver-checks >/dev/null 2>&1; then
              # --force: a cache restore can have left a binary the
              # probe cannot run; install must replace, not abort.
              cargo +stable install cargo-semver-checks --locked --force
              echo "installed=true" >> "$GITHUB_OUTPUT"
            else
              # Presence is not runnability: a cache-restored binary that
              # cannot execute would red the ARMED baseline run below on
              # infra, not on a surface break. Verify, replace if broken.
              cargo-semver-checks --version >/dev/null 2>&1 || {
                cargo +stable install cargo-semver-checks --locked --force
                echo "installed=true" >> "$GITHUB_OUTPUT"
              }
            fi
          else
            # Probe the binary DIRECTLY, never as `cargo cargo-semver-checks`:
            # that asks cargo for an external subcommand named
            # cargo-semver-checks, i.e. a binary called
            # cargo-cargo-semver-checks, which does not exist — the
            # probe read empty, the mismatch guard reinstalled over the
            # just-restored cache, and cargo install aborted (red gate
            # on every cache-hit run). `|| true` rescues set -o
            # pipefail when the binary is absent (a failed probe must
            # read "no cached version", never abort the job).
            cached="$(cargo-semver-checks --version 2>/dev/null | tail -n 1 | awk '{print $NF}' || true)"
            if [ "$cached" != "$version" ]; then
              cargo +stable install cargo-semver-checks --locked --force --version "$version"
              echo "installed=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # ARMED in-repo baseline guards (#160, epic-6 retro A1; ktesio-engine
          # armed in story 7-4): diff the FROZEN public surfaces against their
          # freeze commits. The guard fires on ANY breaking surface change vs
          # the baseline (removal, rename, signature) — whether or not it was
          # announced; announcement enforcement is review discipline until the
          # crates.io flow gives each crate a real release-to-release baseline
          # (the dormant per-crate crates.io loop below arms at first publish).
          #
          # TWO baselines, two honest freeze points:
          # * ktesio-adapter-api @ 4119db3 — the contract-v1 freeze commit: the
          #   contract surface has been frozen since story 6-6.
          # * ktesio-engine @ 8a8b328 — the EMBEDDING-surface freeze (stories
          #   7-1/7-2/7-3 landed; story 7-4 arms the guard). Deliberately NOT
          #   4119db3: the engine's surface was legitimately still growing when
          #   the contract froze (the freeze itself added the
          #   `LaunchResolveError::ContractIncompatible` variant to an engine
          #   error enum, and the lifecycle/events stories reshaped more) — the
          #   engine was `publish = false` throughout, so those were allowed
          #   evolution, and a 4119db3 baseline would red CI on that honest
          #   history. The embedding surface the hosts see freezes at 7-3's
          #   commit instead. Same mechanism, same pins, same bump procedure.
          #
          # Maintenance: at the next deliberate freeze (a contract-v2 freeze
          # for adapter-api, or an announced engine major), update the SHAs
          # here — and their copies in scripts/test_automation.py — together.
          # The baseline builds resolve the freeze commit's OWN dependencies;
          # if one is ever yanked/deleted upstream, the guard reds on infra —
          # bump the SHA to a known-good commit rather than debugging the
          # gate. The cat-file checks below keep a history-rewrite/GC failure
          # a CLEAR error instead of a confusing semver-checks resolution
          # abort.
          git cat-file -e 4119db37b5288b990144d28f995ee14a69271b5e^{commit} || {
            echo "::error::semver baseline rev 4119db37… is not resolvable in this checkout (history rewrite or shallow clone?) — the guard cannot run."
            exit 1
          }
          cargo +stable semver-checks check-release -p ktesio-adapter-api --baseline-rev 4119db37b5288b990144d28f995ee14a69271b5e
          git cat-file -e 12f3aabfadcd9a6c18c03837dbd2778b1e9f5755^{commit} || {
            echo "::error::semver baseline rev 8a8b328… is not resolvable in this checkout (history rewrite or shallow clone?) — the guard cannot run."
            exit 1
          }

          # BASELINE-REV CONSTRAINT (learned 2026-09-09): this repo squash-merges,
          # so branch commits never enter main history — a baseline rev MUST be a
          # main-side commit (an earlier landing or a merge commit) or the cat-file
          # check reds every post-merge run (8a8b328 was a branch-only commit and
          # did exactly that). Bump baselines only to main-history revs at
          # deliberate freeze points, together with scripts/test_automation.py.
          cargo +stable semver-checks check-release -p ktesio-engine --baseline-rev 12f3aabfadcd9a6c18c03837dbd2778b1e9f5755
          for crate in ktesio-engine ktesio-adapter-api; do
            status="$(curl --silent --show-error --user-agent "$user_agent" --max-time 30 --retry 3 --output /dev/null --write-out "%{http_code}" "https://crates.io/api/v1/crates/${crate}")" || status=000
            case "$status" in
              200)
                # The binary was ensured above; the crates.io baseline (once
                # the held publish runs) is the authoritative
                # release-to-release gate — no version re-probe happens here.
                cargo +stable semver-checks check-release -p "$crate"
                ;;
              404)
                echo "::notice::${crate} has no published baseline on crates.io yet; the crates.io release-to-release gate arms at first publish (the HELD publish runbook, docs/release-process.md)."
                ;;
              000|429|5[0-9][0-9])
                echo "::notice::crates.io returned transient status ${status} for ${crate}; skipping the semver check this run."
                ;;
              *)
                echo "::error::Unexpected crates.io API status ${status} while checking ${crate}."
                exit 1
                ;;
            esac
          done
      - name: Save cargo-semver-checks binary (only when an install ran)
        if: steps.semver_check.outputs.installed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # AI-3: the save is CONDITIONAL (an install actually ran) and keyed
          # on the resolved version — a dormant run can never freeze an empty
          # entry under a key the armed gate later restores.
          key: ${{ runner.os }}-cargo-semver-checks-bin-${{ steps.semver_version.outputs.version }}
          path: |
            ~/.cargo/bin

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned MSRV toolchain
        # Floor set by the bundled-SQLite build: rusqlite 0.40.1 →
        # libsqlite3-sys 0.38.1 uses cfg_select!, stabilized in 1.96.1. Keep in
        # lockstep with rust-version in the root Cargo.toml [workspace.package].
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-msrv-
      - name: Check workspace builds on the MSRV
        # --all-targets (not just the lib graph) so the DEV-dependencies
        # compile on the pinned floor too: the story-7-5 perf harness carries
        # `sysinfo` as a benchmark-gated dev-dep, and a future sysinfo MSRV
        # bump past 1.96.1 must red HERE (on a lockfile refresh), not in a
        # contributor's local build.
        run: cargo +1.96.1 check --workspace --all-targets

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, build, docs, boundary, semver]
    # 90: the FIRST run on a cold coverage cache must compile the ENTIRE dependency
    # graph WITH coverage instrumentation — a separate fingerprint from the other
    # jobs' normal-profile target, so nothing is reusable. That one-time cold build
    # (not the test run) is what repeatedly blew the 20- then 40-min caps (AI-23);
    # llvm did not help because the cost is compile, not execution. The dedicated
    # coverage cache below persists the instrumented target so every later run is
    # warm; 90 is generous headroom because coverage now runs tarpaulin ONCE PER
    # CRATE (5 sequential runs, #101) instead of one --workspace pass — the split
    # keeps each instrumented run's live process tree small enough to fit the 7 GB
    # runner, but the sum of the sequential runs is longer than a single pass.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo (coverage-specific)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # DEDICATED key — not the shared ${{ runner.os }}-cargo-<lock> the other
          # jobs use. Tarpaulin builds the whole graph with coverage instrumentation
          # (different rustflags → different fingerprints), so it can NEVER reuse the
          # other jobs' normal-profile target. Sharing the key also meant coverage
          # restored useless artifacts and — the key already existing when this job
          # (which `needs` the others) ran — never SAVED its own instrumented target,
          # so every run recompiled the graph cold and blew the timeout (AI-23). This
          # key persists the instrumented target; only the first run builds it cold.
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-coverage-
      - name: Cache cargo-tarpaulin binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Persist the source-installed cargo-tarpaulin so coverage does not
          # rebuild it (~10 min) on every fresh runner (AI-23) — mirrors the
          # semver job's cargo-semver-checks-bin cache (AI-1). restore-keys lets a
          # partial-key match seed ~/.cargo/bin so a bumped exact key still warms
          # from the prior binary instead of a cold rebuild (AI-3: a constant key
          # can freeze an empty entry).
          key: ${{ runner.os }}-cargo-tarpaulin-bin
          path: |
            ~/.cargo/bin
          restore-keys: ${{ runner.os }}-cargo-tarpaulin-bin
      - name: Add llvm coverage tooling
        # --engine llvm (below) shells out to llvm-profdata / llvm-cov to merge the
        # profraw output; llvm-tools-preview provides them for the stable toolchain.
        run: rustup component add llvm-tools-preview
      - name: Install cargo-tarpaulin
        # Explicit +stable (see fmt job): coverage runs on latest stable; the root
        # rust-toolchain.toml pins only local bare cargo. Idempotent install: on a
        # cache hit the binary is already on PATH, so the `command -v` guard skips
        # the rebuild (matches the semver gate's guarded install, AI-23).
        run: command -v cargo-tarpaulin >/dev/null 2>&1 || cargo +stable install cargo-tarpaulin --locked
      - name: Install lcov (per-crate coverage merge, #101)
        # The per-crate split (#101) writes one LCOV tracefile per crate; lcov
        # merges them into the workspace-aggregate the --fail-under 95 gate is
        # enforced on. apt's lcov is enough — only `lcov -a`/`--summary` are used.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lcov
      - name: Reclaim disk + add swap for the instrumented run
        # The instrumented build is far heavier than the normal `test` job (coverage
        # counters + the fleet/adoption tests each spawning several instrumented
        # children), and the runner "lost communication" ~49 min in — an OOM that
        # drops the job with no log (AI-23). Two pressures, addressed together:
        #   * DISK — the instrumented target + profraw sit on `/` (~14 GB free); an
        #     earlier swap file on /mnt did NOT relieve `/`. Free the big unused
        #     preinstalled SDKs (~30 GB) so the instrumented target has room.
        #   * RAM — an 8 GB swap file on the roomy /mnt temp disk lets a spike page
        #     instead of OOM-ing. (CARGO_PROFILE_DEV_DEBUG=1 below also shrinks the
        #     instrumented binaries, cutting both RAM and `/` disk — coverage same.)
        run: |
          set -euo pipefail
          echo "before:"; df -h / /mnt; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo fallocate -l 8G /mnt/covswap
          sudo chmod 600 /mnt/covswap
          sudo mkswap /mnt/covswap
          sudo swapon /mnt/covswap
          echo "after:"; df -h / /mnt; free -h
      - name: Enforce coverage (per-crate split + merged aggregate gate, #101)
        # WHY the split (#101): a single `cargo tarpaulin --workspace` instruments
        # the ENTIRE graph (tokio + bundled-SQLite C + a 13-crate hyper stack) and
        # runs all ~1075 tests instrumented; even after the AI-23 fixes (dedicated
        # cache, --engine llvm, serial tests, 8 GB swap, disk reclaim, line-tables
        # debuginfo) the instrumented run's live process tree still OOM'd the 7 GB
        # runner ("runner lost communication", no log). Running tarpaulin ONCE PER
        # CRATE (`-p <crate>`) keeps each run's resident set small enough to fit.
        #
        # CORRECTNESS (de-risked locally before this landed): tarpaulin reports
        # coverage for ALL workspace source each built test binary touches, NOT just
        # the `-p` crate's own source — so a ktesio-engine line covered only by a
        # `kt` CLI test IS credited under `-p ktesio`. The UNION of the five
        # per-crate tracefiles therefore reproduces the --workspace result exactly:
        # locally the merged aggregate is 95.22% (5718/6005), identical to
        # --workspace to the line (0 lines lost, 0 gained). No report-scope flag is
        # needed; the merge just needs `lcov --ignore-errors inconsistent` because
        # lcov 2.x rejects the benign FN-start-line drift tarpaulin emits across
        # runs (function metadata only — it does not touch DA/LF/LH line data).
        #
        # ORDER: lightest → heaviest, ktesio-engine LAST. If the heavy crate still
        # OOMs the runner, the lighter crates' tracefiles + per-crate numbers are
        # already printed, so a per-crate OOM is diagnosable (which crate, at what
        # `free`/`df`) instead of one opaque --workspace failure.
        #
        # Flags unchanged from the --workspace gate: --engine llvm (parity with the
        # local macOS gate, see docs/testing.md), --skip-clean (reuse the cached
        # instrumented target), --timeout 180 (raise tarpaulin's 60 s per-test cap),
        # --verbose (progress). Env unchanged (AI-23): RUST_TEST_THREADS=1 runs the
        # instrumented tests serially; CARGO_PROFILE_DEV_DEBUG=1 builds line-tables-
        # only debuginfo (smaller instrumented binaries, coverage unchanged). The
        # merged aggregate replaces tarpaulin's per-run --fail-under 95 with the SAME
        # workspace >= 95 gate enforced on the union (a per-crate --fail-under would
        # wrongly fail the lighter crates, which see only part of the workspace).
        env:
          RUST_TEST_THREADS: "1"
          CARGO_PROFILE_DEV_DEBUG: "1"
        shell: bash
        run: |
          set -euo pipefail
          # STALE `fake_agent` GUARD -- the ROOT CAUSE of this job's long red
          # streak, and the SAME defect class already fixed in the `test` job (see
          # its "Build test binaries" step, which carries the fuller write-up).
          # This job's `target/` cache key is derived from
          # `hashFiles('**/Cargo.lock')`, so a change touching ONLY the
          # `fake_agent` test helper CANNOT bust it: the entry stays frozen at
          # whatever helper was built the last time Cargo.lock moved, which here
          # predated the `--echo-stdin` / `--heartbeat-stderr-ms` flags.
          # `fake_agent`'s arg parser ignores unknown args (`_ => {}`), so the
          # stale binary silently never echoes stdin and never writes stderr, and
          # the tests then wait out their deadlines for output that can never
          # arrive -- surfacing as deadline-miss asserts ("never observed ... in
          # agent.log" / "echoed stdin line never appeared") that LOOK like slow
          # IO but are a missing feature. Compounding it: tarpaulin compiles the
          # helper only as a `--test` artifact and never uplifts it to
          # target/debug/fake_agent, while `ktesio_conformance::fake_agent_bin()`
          # accepts that path when the file merely EXISTS (no freshness check) --
          # so the frozen copy is exactly what every spawning test runs.
          #
          # Proven, not inferred: swapping the pre-6afac99 helper in locally
          # reproduces the exact CI assertion with NO instrumentation at all,
          # while a freshly built helper passes under real tarpaulin in 0.35s.
          # Instrumentation latency was NOT the cause.
          #
          # `rm` + an EXPLICIT build (not just `rm`) for the same reason the test
          # job needs both: nothing in the tarpaulin path ever places that
          # top-level hardlink, so without the build the spawning tests would race
          # on the lib's on-demand `cargo build` fallback (concurrent cargo
          # invocations contend on the build-dir lock -- an observed flake). The
          # plain profile also keeps the helper OUT of the coverage denominator,
          # which is the documented posture (docs/testing.md: `fake_agent` runs
          # only as a spawned subprocess and is excluded from coverage).
          rm -f target/debug/fake_agent target/debug/fake_agent.exe
          rm -f target/debug/hermes_shim target/debug/hermes_shim.exe
          cargo +stable build -p ktesio-conformance --bin fake_agent
          # hermes_shim: same freshness + lock-contention rationale as
          # fake_agent above (review-of-6-2, vg-o1) — its locator also accepts
          # a merely-EXISTING target/debug/hermes_shim.
          cargo +stable build -p ktesio-conformance --bin hermes_shim
          # NO RETRY WRAPPER. The former 3-attempt whole-job retry (PR #117, built
          # on a since-disproven "runner contention" theory) could never converge:
          # the failure above is DETERMINISTIC, so every attempt re-hit it. It
          # stays removed -- the coverage steps below run exactly ONCE. (The
          # per-crate split, swap, and disk reclaim are a SEPARATE OOM mitigation
          # and stay untouched.)
          rm -rf cov && mkdir -p cov
          # Crate list as positional params (portable, no word-split reliance):
          # lightest → heaviest, ktesio-engine LAST (see the WHY comment above).
          set -- ktesio-adapter-api ktesio-conformance ktesio-adapters-hermes ktesio ktesio-engine
          for pkg in "$@"; do
            echo "::group::tarpaulin -p $pkg"
            echo "--- resources before $pkg ---"
            free -h || true
            df -h / || true
            cargo +stable tarpaulin --engine llvm --skip-clean --timeout 180 --verbose \
              -p "$pkg" --out Lcov --output-dir "cov/$pkg"
            echo "::endgroup::"
          done
          # Merge the per-crate tracefiles into the workspace aggregate. The
          # `hermes` crate is a tiny mapping-only lib (no coverable logic of its
          # own) -- it may legitimately produce no lcov.info; it is the ONLY crate
          # allowed to skip the merge with no lcov.info. --ignore-errors
          # inconsistent: tolerate lcov 2.x's benign cross-run FN-start-line drift
          # (line data is unaffected).
          #
          # PR #117 fix pass: this used to skip ANY crate with no lcov.info, not
          # just hermes. That silently swallowed a real failure mode -- when a
          # crate's OWN tarpaulin run fails (e.g. ktesio-engine hitting one of this
          # job's real-IO tests), it produces no lcov.info too, and the old
          # code merged the aggregate from whatever crates DID succeed anyway. The
          # resulting gate failure ("merged coverage NN% is below 95%") read like a
          # genuine coverage shortfall across the whole workspace, when the real
          # story was "ktesio-engine's measurement is entirely missing, so the
          # smaller remaining slice can't possibly clear a 95% bar sized for the
          # full workspace" -- confusing, and it silently accepted a
          # SUBSET-OF-THE-WORKSPACE gate as if it were the real one. Any crate
          # OTHER than the known doc-only stub missing its lcov.info now fails the
          # gate LOUDLY and immediately, before the misleading percentage math
          # ever runs.
          add_args=""
          for pkg in "$@"; do
            if [ -s "cov/$pkg/lcov.info" ]; then
              add_args="$add_args -a cov/$pkg/lcov.info"
            elif [ "$pkg" = "ktesio-adapters-hermes" ]; then
              echo "::notice::no coverable lines for $pkg (expected for the mapping-only hermes lib); skipping in merge."
            else
              echo "::error::$pkg produced no lcov.info -- its tarpaulin run above almost certainly failed (a crashed/failed test suite, not a legitimately-empty crate). Failing the coverage gate rather than silently merging a partial, misleading aggregate."
              exit 1
            fi
          done
          echo "::group::merge tracefiles"
          # shellcheck disable=SC2086
          lcov $add_args -o cov/merged.info --ignore-errors inconsistent,inconsistent
          echo "::endgroup::"
          # Enforce the SAME workspace >= 95 gate on the MERGED aggregate. Parse the
          # `(<hit> of <found> lines)` FRACTION from `lcov --summary` (version-stable
          # across lcov 1.x/2.x) and compute the exact percentage — more robust than
          # the 1-decimal rounded `NN.N%` near the boundary. `lines_pair` is the two
          # integers "<hit> <found>"; a single awk both extracts and decides, so
          # there is no heredoc / read indentation fragility.
          echo "::group::merged coverage summary"
          lcov --summary cov/merged.info --ignore-errors inconsistent 2>&1 | tee cov/summary.txt
          echo "::endgroup::"
          lines_pair="$(grep -E '^[[:space:]]*lines[.]*:' cov/summary.txt \
            | sed -E 's/.*\(([0-9]+) of ([0-9]+) lines\).*/\1 \2/' | head -1)"
          hit="${lines_pair%% *}"
          found="${lines_pair##* }"
          if [ -z "${found:-}" ] || ! [ "${found}" -gt 0 ] 2>/dev/null; then
            echo "::error::Could not parse merged line coverage from lcov --summary; aborting the coverage gate (#101)."
            exit 1
          fi
          pct="$(awk -v h="$hit" -v f="$found" 'BEGIN { printf "%.4f", (h / f) * 100 }')"
          echo "Merged workspace coverage: ${pct}% (${hit}/${found} lines) across the per-crate split (#101)."
          if awk -v p="$pct" 'BEGIN { exit (p + 0 >= 95) ? 0 : 1 }'; then
            echo "Coverage gate green: merged ${pct}% >= 95% on the per-crate union (#101)."
          else
            echo "::error::Merged workspace coverage ${pct}% (${hit}/${found} lines) is below the 95% gate (#101 per-crate split + lcov merge)."
            exit 1
          fi
