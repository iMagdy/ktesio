[workspace]
resolver = "2"
members = [
    "crates/kt",
    "crates/ktesio-engine",
    "crates/ktesio-adapter-api",
    "crates/ktesio-adapters-hermes",
    "crates/ktesio-conformance",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
# Minimum supported Rust version. Floor is set by the bundled-SQLite build:
# rusqlite 0.40.1 → libsqlite3-sys 0.38.1 uses cfg_select!, stabilized in
# 1.96.1 (builds cleanly there; 1.94.1 fails with E0658). Members inherit via
# `rust-version.workspace = true`.
rust-version = "1.96.1"
license-file = "LICENSE"
homepage = "https://github.com/Ktesio/ktesio"
repository = "https://github.com/Ktesio/ktesio"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[workspace.dependencies]
# Internal crates
ktesio-engine = { path = "crates/ktesio-engine", version = "0.3.0" }
ktesio-adapter-api = { path = "crates/ktesio-adapter-api", version = "0.1.0" }
ktesio-adapters-hermes = { path = "crates/ktesio-adapters-hermes", version = "0.1.0" }

# External dependencies (single source of truth for versions)
clap = { version = "4", features = ["derive"] }
# Async runtime for the engine supervision core (AD-13, Islam-approved in story
# 1-4). Minimal feature set — NOT "full": rt-multi-thread (the runtime the
# blocking facade owns), process (spawn/wait child agents), time (the graceful
# stop window), sync (supervisor channels), macros (#[tokio::test]), net +
# io-util (story 3-4: the engine-observed loopback forward listener's async TCP +
# stream copy — loopback HTTP is portable, NO OS cfg). We do NOT enable/require
# tokio_unstable — process-group control uses nix/windows-sys in the engine
# backends instead. Referenced by ktesio-engine only (kt uses the blocking
# facade; adapter-api is pure contract types). MSRV 1.71 << floor 1.96.1.
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "macros", "net", "io-util"] }
# Engine-observed metering (AD-7 / FR-19), story 3-4: the loopback forward
# listener's HTTP substrate. `hyper` is the de-facto LEAN async HTTP building
# block (server + client + http1); `hyper-util` provides the tokio glue (the
# legacy client for the outbound forward leg + the auto/graceful server conn);
# `http-body-util` + `bytes` collect/relay request/response bodies faithfully.
# NFR-8 architecture justification (REWRITTEN story 12-3): this is the SINGLE
# new HTTP dependency family for the engine-observed interception point — no
# heavier web framework. The TLS stack (below) is VENDORED rustls+ring: no
# system TLS library (no OpenSSL/native-tls/security-framework), matching the
# dependency philosophy that already bundled SQLite and that `kt`→`ureq`
# already paid into (one rustls+ring pair unifies across the whole workspace —
# verify with `cargo tree -p ktesio-engine -e normal | grep -E "rustls|ring"`).
# All build cleanly on MSRV 1.96.1. Referenced by ktesio-engine ONLY (the
# listener is engine-internal, AD-2; kt never sees it) — a normal external
# edge, unaffected by the AD-2 boundary gate.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
# Story 12-3 (AI-47a ratified option i): the engine-observed listener dials
# `https://` upstreams DIRECTLY — the local-TLS-hop deferral is replaced by a
# working forward over a VENDORED TLS stack. `hyper-rustls` is the hyper-native
# TLS connector (both schemes through one client: `.https_or_http()`),
# `rustls` is the TLS implementation, `webpki-roots` the vendored root store —
# NO system TLS dependency anywhere (native-tls/OpenSSL rejected: Linux OpenSSL
# variance violates the philosophy; ring's C+asm is a vendored build like the
# bundled SQLite, degree not kind). `default-features = false` keeps
# aws-lc-rs (a CMake/haskell build) OUT and selects the `ring` provider —
# the SAME rustls+ring pair `kt`→`ureq` already ships, so the tree holds ONE
# copy of each (the feature-hygiene gate greps `cargo tree`). The `logging`
# feature stays OFF: rustls/hyper-rustls never emit tracing here (the AI-48
# tracing-exposure note in docs/embedding.md covers the checkpoint). The
# engine names rustls DIRECTLY only to build the `ClientConfig` (production
# webpki-roots default + the test seam) and the TLS upstream test server. The
# `native-tokio` feature is deliberately OFF: in hyper-rustls 0.27 it no longer
# gates the tokio runtime (tokio is the default) — it only pulls
# `rustls-native-certs` (system trust-store lookup, plus its macOS
# security-framework dep), which the engine never uses (roots are vendored
# webpki-roots), so the tree stays free of system-trust surfaces.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
# Engine state store (AD-6): bundled SQLite, no system dependency.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Cross-platform data-dir resolution; keeps engine path code cfg-free (OS-cfg gate).
directories = "6"
console = "0.16"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TOML deserializer for the manifest-adapter schema (adapter.toml). Owned by
# ktesio-adapter-api ONLY (AD-3: it owns manifest parsing); the engine + kt
# consume the parsed form. New dep this story (approved: `toml = "1"`).
toml = "1"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
semver = "1"
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
# Story 7-5 perf harness: the process-metrics crate behind the NFR-4
# steady-state measurement (the ENGINE process's CPU% + RSS). DEV-DEPENDENCY
# ONLY — consumed solely by ktesio-engine's `[dev-dependencies]` for the
# benchmark-gated `perf-budgets` example (it never enters any shipping
# artifact, so NFR-8's runtime-lean policy is untouched and the AD-2
# `cargo tree -p ktesio -e normal,build` gate is unchanged). Renamed here so
# the workspace stays the single source of truth for versions. Justification
# over hand-rolled /proc parsing (spec 7-5 design note): cross-platform by
# contract (Windows needs the crate anyway), and sysinfo's two-refresh CPU
# delta is the standard, maintained implementation. `default-features = false`
# with ONLY the required `system` handle feature (the `System` type itself is
# feature-gated even though process metrics are core) — the component/disk/
# network/user probe features (and their windows/objc2 stacks) stay out of
# the dev build.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Story 12-3: the self-signed test root for the TLS upstream test (the in-crate
# https+SSE composition test). DEV-DEPENDENCY ONLY — never a shipping artifact,
# NFR-8's runtime-lean policy is untouched. rcgen's default `ring` backend is
# the SAME ring provider the TLS stack above ships, so no extra C build.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
