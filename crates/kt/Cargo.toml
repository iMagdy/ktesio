[package]
# crates.io package name stays "ktesio" for install continuity (FR-39);
# "kt" is the directory/colloquial name and the shipped binary name.
name = "ktesio"
version.workspace = true
edition.workspace = true
description = "Agentic skills package manager"
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["agentic", "skills", "package-manager", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kt"
path = "src/main.rs"

[dependencies]
ktesio-engine = { workspace = true }
clap = { workspace = true }
console = { workspace = true }
miette = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
regex = { workspace = true }
dialoguer = { workspace = true }
ureq = { workspace = true }
urlencoding = { workspace = true }
semver = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
