[package]
name = "ktesio-conformance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Ktesio adapter conformance test kit (TCK) and mock adapter"
license.workspace = true
homepage.workspace = true
repository.workspace = true
# TODO(story 7-4): remove `publish = false` when the boundary is proven and
# the workspace crates are published to crates.io.
publish = false

[dependencies]
ktesio-adapter-api = { workspace = true }

# Story 6-2: the `hermes_shim` PATH-shim bin re-execs the fake_agent fixture.
[[bin]]
name = "hermes_shim"
path = "src/bin/hermes_shim.rs"

[lints]
workspace = true
