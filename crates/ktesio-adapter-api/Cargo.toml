[package]
name = "ktesio-adapter-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Ktesio Adapter Contract: the types and traits agent adapters implement"
license.workspace = true
homepage.workspace = true
repository.workspace = true
# TODO(story 7-4): remove `publish = false` when the boundary is proven and
# the workspace crates are published to crates.io.
publish = false

[dependencies]
# Schema structs derive Deserialize; the contract types derive Serialize too so
# a projected Capability Declaration can be persisted by the engine.
serde = { workspace = true }
# adapter.toml parser. This crate OWNS manifest parsing (AD-3); it is the ONLY
# crate that depends on `toml` (the engine + kt consume the parsed form).
toml = { workspace = true }
# thiserror for ManifestError (adapter-api uses thiserror, never miette —
# conventions).
thiserror = { workspace = true }
# Manifest `contract_version` is validated as a real semver version (not merely a
# non-empty string). `semver` is already a workspace dep (kt's lockfile uses it);
# this is not a NEW external dependency, only a new use of an existing one.
semver = { workspace = true }

[dev-dependencies]
# Test-only: assert the serde wire form of the small contract enums (OsId,
# SupportLevel, MeteringSource) round-trips, mirroring the engine's use of
# serde_json purely for wire-form assertions.
serde_json = { workspace = true }

[lints]
workspace = true
